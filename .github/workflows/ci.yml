name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check app tests scripts
      - name: Format check
        run: ruff format --check app tests scripts
      - name: Test
        run: python -m pytest --junitxml=reports/junit.xml --cov=app --cov-report=term-missing
      - name: Validate scenario manifest
        run: python scripts/run_scenario.py --list
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
          if-no-files-found: ignore
